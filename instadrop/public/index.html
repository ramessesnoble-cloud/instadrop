<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Instadrop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Food, groceries, drinks and home essentials delivered in your region.">
<meta name="theme-color" content="#D93A12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top" id="hdr"></header>
  <main id="main" aria-live="polite"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Cart"></aside>
<aside class="sheet" id="modal" aria-label="Options"></aside>
<aside class="sheet" id="pick" aria-label="Settings"></aside>
<button class="fcart" id="fcart" hidden></button>
<div class="toast" id="toast" role="status"></div>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-auth.js"></script>
